      #     name: Electron-CyberChef-${{ matrix.os }}
      #     path: |
      #       dist/*.dmg
      #       dist/*.deb
      #       dist/*.tar.xz
      #       dist/*.AppImage
      #       dist/*.exe
      #       dist/*.zip
      #     if-no-files-found: ignore