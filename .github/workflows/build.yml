name: Build - pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build-cmd: npx electron-builder -m
          - os: ubuntu-latest
            build-cmd: npx electron-builder --linux deb tar.xz
          - os: windows-latest
            build-cmd: npx electron-builder --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with electron-builder
        run: ${{ matrix.build-cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder tries to publish/auto-detect updates by default;
          # this disables that so the workflow just builds artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v4
